name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm 10 through Corepack
        run: |
          corepack enable
          corepack install --global pnpm@10.27.0

      - name: Locate pnpm store
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm check

      - name: Test with coverage
        # `--concurrency=2`: this runner has 2 vCPUs. Unbounded, turbo starts every workspace
        # package's vitest at once and each of those forks its own worker per core, so ~24
        # coverage-instrumented processes compete for 2 cores and stretch individual cases 15-18x
        # -- which is what timed tests out in runs 33109728652 and 33111592003, not any single
        # slow test. Bounding turbo to 2 concurrent packages keeps oversubscription near 1 worker
        # per core.
        #
        # `--filter=!@autostack/runner-local`: that package is macOS-only by design, not by
        # accident. Milestone A is scoped to "one developer on macOS Apple Silicon"
        # (docs/superpowers/specs/2026-08-20-autostack-design.md, section 3.1), Linux desktop
        # packaging is explicitly a separate later project, and runner-local ships only inside the
        # desktop app. The package refuses to construct off the target platform
        # (local-runner-provider.ts:198), reads darwin-only open flags O_NOFOLLOW_ANY and O_UNIQUE
        # (path-security.ts:24-27), skips an entire capability assertion off darwin
        # (path-security.ts:215), and classifies child termination against a darwin signal table
        # (darwin-process-signals.ts). Its suite asserts APFS semantics the source documents, such
        # as a file entry moving a directory's link count (data-root-lock.ts:519). Running it on
        # ubuntu tests an unsupported platform; it runs for real in the macOS job below. Its
        # `check` task still runs here, because `test:coverage` dependsOn `^check`.
        run: pnpm test:coverage --concurrency=2 --filter='!@autostack/runner-local'

      - name: Build applications
        # `--filter=!@autostack/desktop` for the same section 3.1 reason as the test step above.
        # The desktop build ends in `node scripts/build-runtime-manifest.mjs`, which describes a
        # staged native runtime: it realpaths `dist/runtime/native`, asserts ownership and
        # permissions on it, and loads it under Electron. Only `pnpm desktop:build` stages that
        # directory, via `rebuild:native`, and the macOS job below is the only job that runs it.
        # Building the desktop app here would mean compiling node-pty against Electron on
        # linux-x64 -- node-pty ships no linux prebuild -- to produce a manifest for an app this
        # platform never runs. Its `check` task still runs here through `^check`, and the macOS job
        # builds it for real.
        run: pnpm build --filter='!@autostack/desktop'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: warn
          retention-days: 7

  local-execution-macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm 10 through Corepack
        run: |
          corepack enable
          corepack install --global pnpm@10.27.0

      - name: Require native Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p process.arch)" = arm64

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron and native runtime
        run: pnpm desktop:build

      - name: Verify real local execution composition
        run: node scripts/verify-local-execution.mjs

      - name: Verify Electron UI, restart, and accessibility
        run: pnpm desktop:e2e

      - name: Test the macOS-only local runner with coverage
        # runner-local is excluded from the ubuntu job because it is implemented against darwin and
        # APFS (see the rationale on that job's test step). This is where it actually runs: native
        # Apple Silicon, the platform Milestone A targets. Placed last so the two composition gates
        # above -- which are this job's purpose and finish in minutes -- fail fast before this
        # ~5-minute suite. Local serialized runtime is ~273s, well inside the 60-minute budget.
        run: pnpm test:coverage --filter=@autostack/runner-local

      - name: Upload sanitized Electron evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-execution-electron
          path: |
            apps/desktop/dist/playwright-report/**
            apps/desktop/dist/e2e-results/**/*.png
            apps/desktop/dist/e2e-results/**/*.zip
          if-no-files-found: error
          retention-days: 7
